name: official Armbian

on:
  workflow_dispatch:
    inputs:
      board:
        description: "board 名，详见 docs/armbian-boards.md"
        type: string
        required: true
        default: "rock-5b"
      branch:
        description: "内核分支"
        type: choice
        required: true
        default: "vendor"
        options:
          - vendor
          - current
          - edge

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache /usr/local/share/boost
          sudo apt-get clean

      - name: Clone Armbian
        run: git clone --depth=1 https://github.com/armbian/build.git armbian-build

      - name: Prepare userpatches
        run: bash .github/scripts/prepare-userpatches.sh armbian-build

      - name: Build
        run: |
          cd armbian-build
          sudo ./compile.sh \
            BOARD=${{ inputs.board }} \
            BRANCH=${{ inputs.branch }} \
            RELEASE=trixie \
            BUILD_MINIMAL=yes \
            BUILD_DESKTOP=no \
            KERNEL_CONFIGURE=no \
            NETWORKING_STACK=network-manager \
            SHARE_LOG=yes

      - name: Package as tar.xz
        run: |
          # compile.sh 用 sudo 运行，产物属于 root，先交还给 runner 用户
          sudo chown -R "$(id -u):$(id -g)" armbian-build/output
          cd armbian-build/output/images
          rm -f *.sha
          for f in *.xz; do [ -f "$f" ] && xz -d -T0 "$f"; done
          for f in *.zst; do [ -f "$f" ] && zstd -d --rm "$f"; done
          tar -I 'xz -9e -T0' -cf "$GITHUB_WORKSPACE/pxvdi-${{ inputs.board }}-${{ inputs.branch }}.tar.xz" .

      - uses: actions/upload-artifact@v4
        with:
          name: pxvdi-${{ inputs.board }}-${{ inputs.branch }}
          path: pxvdi-${{ inputs.board }}-${{ inputs.branch }}.tar.xz
          retention-days: 14
          if-no-files-found: error
          compression-level: 0
