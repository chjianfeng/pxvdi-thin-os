name: ophub armbian

on:
  workflow_dispatch:
    inputs:
      amlogic_soc:
        description: "ophub board 名，详见 docs/ophub-boards.md"
        type: string
        required: true
        default: "s922x"
      armbian_kernel:
        description: "内核版本，stable=默认全部，详见 docs/ophub-boards.md"
        type: choice
        required: true
        default: "stable"
        options:
          - stable
          - 6.12.y
          - 6.18.y
          - 6.6.y
          - 6.1.y
          - 5.15.y

jobs:
  build-base:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache /usr/local/share/boost
          sudo apt-get clean

      - name: Clone Armbian & prepare
        run: |
          git clone --depth=1 https://github.com/armbian/build.git armbian-build
          bash .github/scripts/prepare-userpatches.sh armbian-build

      - name: Detect platform
        id: platform
        env:
          INPUT_BOARD: ${{ inputs.amlogic_soc }}
        run: |
          BOARD_JSON="data/boards.json"

          # 与上游 rebuild 的 batch 语法保持一致，先处理批量写法
          if [[ "$INPUT_BOARD" =~ ^(all|first[0-9]+|last[0-9]+|range[0-9]+_[0-9]+)$ ]]; then
            # 批量写法覆盖多个平台，无法定位单个 board，基础镜像沿用默认的 amlogic
            PLATFORM="amlogic"
            SOC=""
            echo "::notice::批量写法 ${INPUT_BOARD} 无法定位单个 board，基础镜像使用默认 amlogic/odroidn2"
          elif [[ "$INPUT_BOARD" =~ ^(amlogic|rockchip|allwinner)([0-9]+(_[0-9]+)?)?$ ]]; then
            # 平台名，可带范围：rockchip / amlogic50 / rockchip50_100
            PLATFORM="${BASH_REMATCH[1]}"
            SOC=""
          else
            # board 名，多个用 _ 分隔，取第一个来推断平台
            FIRST_BOARD="${INPUT_BOARD%%_*}"
            ENTRY=$(jq -c --arg b "$FIRST_BOARD" '.ophub.boards[] | select(.board == $b)' "$BOARD_JSON")
            if [ -z "$ENTRY" ]; then
              echo "::error::未知的 ophub board: $FIRST_BOARD（可用 board 名、amlogic/rockchip/allwinner 或 all/firstN/lastN/rangeN_M，完整列表见 docs/ophub-boards.md）"
              exit 1
            fi
            PLATFORM=$(jq -r '.platform' <<<"$ENTRY")
            SOC=$(jq -r '.soc' <<<"$ENTRY")
          fi

          case "$PLATFORM" in
            rockchip)
              case "$SOC" in
                rk3588|rk3588s)           BUILD_BOARD="rock-5b" ;;
                rk3568|rk3566|rk3576)     BUILD_BOARD="rock-3a" ;;
                rk3399)                   BUILD_BOARD="rockpi-4b" ;;
                rk3328|rk3528|rk3318)     BUILD_BOARD="rock-2f" ;;
                *)                        BUILD_BOARD="rock-5b" ;;
              esac
              ;;
            allwinner) BUILD_BOARD="orangepizero3" ;;
            *)         BUILD_BOARD="odroidn2" ;;
          esac
          echo "build_board=$BUILD_BOARD" >> $GITHUB_OUTPUT
          echo "Detected platform=$PLATFORM, SOC=${SOC:--} → BUILD_BOARD=$BUILD_BOARD"

      - name: Build Armbian base image
        run: |
          cd armbian-build
          sudo ./compile.sh \
            BOARD=${{ steps.platform.outputs.build_board }} \
            BRANCH=current \
            RELEASE=trixie \
            BUILD_MINIMAL=yes \
            BUILD_DESKTOP=no \
            KERNEL_CONFIGURE=no \
            NETWORKING_STACK=network-manager \
            SHARE_LOG=yes

      - uses: actions/upload-artifact@v4
        with:
          name: armbian-base-image
          path: armbian-build/output/images/*.img*
          compression-level: 0

  repackage-tvbox:
    needs: build-base
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: armbian-base-image
          path: ./base-image

      - name: Prepare base image
        id: prep
        run: |
          cd base-image
          for f in *.xz; do [ -f "$f" ] && xz -d "$f"; done
          for f in *.zst; do [ -f "$f" ] && zstd -d "$f"; done
          img=$(ls *.img | head -1)
          echo "img_path=$(pwd)/${img}" >> $GITHUB_OUTPUT

      - name: Rebuild for TV Box
        uses: ophub/amlogic-s9xxx-armbian@main
        with:
          build_target: armbian
          armbian_path: ${{ steps.prep.outputs.img_path }}
          armbian_board: ${{ inputs.amlogic_soc }}
          armbian_kernel: ${{ inputs.armbian_kernel != 'stable' && inputs.armbian_kernel || '' }}
          auto_kernel: true
          kernel_repo: ophub/kernel
          kernel_usage: stable
          armbian_size: 6000

      - name: Package as tar.xz
        run: |
          cd "${{ env.PACKAGED_OUTPUTPATH }}"
          rm -f *.sha
          for f in *.gz; do [ -f "$f" ] && gzip -d "$f"; done
          for f in *.xz; do [ -f "$f" ] && xz -d -T0 "$f"; done
          for f in *.zst; do [ -f "$f" ] && zstd -d --rm "$f"; done
          tar -I 'xz -9e -T0' -cf "$GITHUB_WORKSPACE/pxvdi-tvbox-${{ inputs.amlogic_soc }}.tar.xz" .

      - uses: actions/upload-artifact@v4
        with:
          name: pxvdi-tvbox-${{ inputs.amlogic_soc }}
          path: pxvdi-tvbox-${{ inputs.amlogic_soc }}.tar.xz
          retention-days: 14
          compression-level: 0

      - uses: geekyeggo/delete-artifact@v5
        with:
          name: armbian-base-image
